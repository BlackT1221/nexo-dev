<svg viewBox="0 0 200 200" width="50" height="50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line-shadow { stroke: #c46902; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .line-front  { stroke: #f58a07; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .diag-shadow { stroke: #c46902; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    .diag-front  { stroke: #f58a07; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    .node-shadow { fill: #c46902; }
    .node-front  { fill: #f58a07; }
  </style>

  <g transform="translate(6, 6)">
    <line x1="50" y1="45" x2="50" y2="155" class="line-shadow" />
    <line x1="150" y1="45" x2="150" y2="155" class="line-shadow" />
    <line x1="50" y1="45" x2="100" y2="100" class="diag-shadow" />
    <line x1="100" y1="100" x2="150" y2="155" class="diag-shadow" />
    
    <circle cx="50" cy="45" r="11" class="node-shadow" />
    <circle cx="50" cy="100" r="11" class="node-shadow" />
    <circle cx="50" cy="155" r="11" class="node-shadow" />
    <circle cx="100" cy="100" r="12" class="node-shadow" />
    <circle cx="150" cy="45" r="11" class="node-shadow" />
    <circle cx="150" cy="100" r="11" class="node-shadow" />
    <circle cx="150" cy="155" r="11" class="node-shadow" />
  </g>

  <g>
    <line x1="50" y1="45" x2="50" y2="155" class="line-front" />
    <line x1="150" y1="45" x2="150" y2="155" class="line-front" />
    <line x1="50" y1="45" x2="100" y2="100" class="diag-front" />
    <line x1="100" y1="100" x2="150" y2="155" class="diag-front" />

    <circle cx="50" cy="45" r="11" class="node-front" />
    <circle cx="50" cy="100" r="11" class="node-front" />
    <circle cx="50" cy="155" r="11" class="node-front" />
    <circle cx="100" cy="100" r="12" class="node-front" />
    <circle cx="150" cy="45" r="11" class="node-front" />
    <circle cx="150" cy="100" r="11" class="node-front" />
    <circle cx="150" cy="155" r="11" class="node-front" />
  </g>
</svg>
