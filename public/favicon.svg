<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f58a07;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c46902;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.3" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="90" fill="none" stroke="none"/>

  <g filter="url(#shadow)" transform="translate(10,10)">
    <path d="M40,40 L70,30 L70,160 L40,170 Z" fill="url(#grad1)" />
    <path d="M70,30 L130,90 L130,110 L70,50 Z" fill="#b35f00" opacity="0.9" />
    <path d="M130,30 L160,40 L160,170 L130,160 Z" fill="url(#grad1)" />
    
    <circle cx="55" cy="35" r="12" fill="#f58a07" stroke="#ffffff" stroke-width="2"/>
    <circle cx="145" cy="165" r="12" fill="#f58a07" stroke="#ffffff" stroke-width="2"/>
    <circle cx="100" cy="98" r="8" fill="#c46902" />
  </g>
</svg>
